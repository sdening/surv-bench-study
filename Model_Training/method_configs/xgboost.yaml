name: xgboost
description: "XGBoost Survival configuration"

# Hyperparameter grid for optimization
hyperparameter_grid: #final
  aft:
    aft_loss_distribution: ['normal', 'extreme']
    aft_loss_distribution_scale: [0.5, 1.0, 2.0]
    learning_rate: [0.1, 0.3]
    max_depth: [null, 6, 10]
    num_boost_round: [500, 1000]
  cox:
    learning_rate: [0.1, 0.3]
    max_depth: [null, 6, 10]
    num_boost_round: [500, 1000]


# Preprocessing settings
preprocessing:
  drop_nzv: true
  drop_high_corr: true
  drop_first: true
  scaling: true
  min_freq: 0.0025
  corr_threshold: 0.98
  data_suffix: "_xgboost"


